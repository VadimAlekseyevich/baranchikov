services:
  exchange-server:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - java
      - -cp
      - target/classes:target/dependency/*
      - org.example.Main
      - /app/data/exchange
      - "9000"
    ports:
      - "9000:9000/udp"
    volumes:
      - exchange-data:/app/data
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - exchange-server
    environment:
      EXCHANGE_HOST: exchange-server
      EXCHANGE_PORT: "9000"
    command:
      - mvn
      - -q
      - test

volumes:
  exchange-data:
