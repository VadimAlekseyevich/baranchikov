syntax = "proto3";
package exchange;
option java_package = "org.example.exchange.proto";
option java_outer_classname = "ExchangeMessages";

message Envelope {
  string request_id = 1;
  string operation = 2;
  bytes payload = 3;
  bool success = 4;
  string error = 5;
}
message OrderRequest {
  string client_id = 1;
  string base = 2;
  string quote = 3;
  string side = 4;
  string quantity = 5;
  string price = 6;
}
message OrderRecord {
  int64 id = 1;
  string client_id = 2;
  string base = 3;
  string quote = 4;
  string side = 5;
  string price = 6;
  string original_quantity = 7;
  string remaining_quantity = 8;
}
message TradeRecord {
  int64 id = 1;
  string base = 2;
  string quote = 3;
  string price = 4;
  string quantity = 5;
  int64 buy_order_id = 6;
  int64 sell_order_id = 7;
  string buyer_id = 8;
  string seller_id = 9;
}
message Records {
  repeated OrderRecord orders = 1;
  repeated TradeRecord trades = 2;
}
message ClientRequest {
  string client_id = 1;
  string base = 2;
  string quote = 3;
}
