name: Lab 6 sharding tests
on:
  push:
    paths: ['lab6/**', '.github/workflows/lab6.yml']
  pull_request:
    paths: ['lab6/**', '.github/workflows/lab6.yml']
jobs:
  maven-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: lab6/pom.xml
      - name: Sharding unit tests
        working-directory: lab6
        run: mvn -B test
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sharded Docker integration tests
        working-directory: lab6
        run: |
          docker compose build
          docker compose up -d facade
          docker compose run --rm tests
      - name: Container logs on failure
        if: failure()
        working-directory: lab6
        run: docker compose logs --no-color --tail=120
      - name: Cleanup
        if: always()
        working-directory: lab6
        run: docker compose down -v || true
